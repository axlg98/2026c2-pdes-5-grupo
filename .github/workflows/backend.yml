name: CTV CI/CD

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read
  packages: write

env:
  JWT_SECRET: ci-cd-test-secret

jobs:
  test-flight-api:
    name: Test Flight API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flight-api
    services:
      flights-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flights
          POSTGRES_USER: flights
          POSTGRES_PASSWORD: flights
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U flights -d flights"
          --health-interval=5s
          --health-retries=10
    env:
      DB_HOST: localhost
      DB_PORT: 5433
      DB_NAME: flights
      DB_USER: flights
      DB_PASSWORD: flights
      PORT: 3001
      JWT_SECRET: ci-cd-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: flight-api/package-lock.json
      - run: npm ci
      - run: npm run db:migrate
      - run: npm test

  test-backend:
    name: Test CTV Backend
    runs-on: ubuntu-latest
    needs: test-flight-api
    defaults:
      run:
        working-directory: backend
    services:
      ctv-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ctv
          POSTGRES_USER: ctv
          POSTGRES_PASSWORD: ctv
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ctv -d ctv"
          --health-interval=5s
          --health-retries=10
      flights-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flights
          POSTGRES_USER: flights
          POSTGRES_PASSWORD: flights
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U flights -d flights"
          --health-interval=5s
          --health-retries=10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: ctv
      DB_USER: ctv
      DB_PASSWORD: ctv
      JWT_SECRET: ci-cd-test-secret
      ADMIN_NAME: Admin
      ADMIN_EMAIL: admin
      ADMIN_PASSWORD: 123456
      FLIGHT_API_URL: http://localhost:3001
      PORT: 3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm test
      - run: npm run test:cucumber
      - name: Install Playwright browser and frontend dependencies
        run: |
          npx playwright install --with-deps chromium
          npm ci --prefix ../frontend
          
      - name: Start Flight API for integration
        working-directory: flight-api
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_NAME: flights
          DB_USER: flights
          DB_PASSWORD: flights
          PORT: 3001
          JWT_SECRET: ci-cd-test-secret
        run: |
          npm ci
          npm run db:migrate
          npm start > /tmp/flight-api.log 2>&1 &
          echo $! > /tmp/flight-api.pid
          for attempt in {1..30}; do
            if curl --fail http://localhost:3001/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/flight-api.log
          exit 1
      - name: Start backend for E2E
        run: |
          npm start > /tmp/ctv-backend.log 2>&1 &
          echo $! > /tmp/ctv-backend.pid
          for attempt in {1..30}; do
            if curl --fail http://localhost:3000/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/ctv-backend.log
          exit 1
      - name: Start frontend for UI E2E
        run: |
          npm --prefix ../frontend run dev -- --host 0.0.0.0 --port 5173 --strictPort > /tmp/ctv-frontend.log 2>&1 &
          echo $! > /tmp/ctv-frontend.pid
          for attempt in {1..30}; do
            if curl --fail http://127.0.0.1:5173/login; then exit 0; fi
            sleep 1
          done
          cat /tmp/ctv-frontend.log
          exit 1
      - name: Run backend and UI E2E
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_ADMIN_EMAIL: admin
          E2E_ADMIN_PASSWORD: 123456
        run: npm run test:e2e
      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/ctv-frontend.pid ]; then kill $(cat /tmp/ctv-frontend.pid) || true; fi
          if [ -f /tmp/ctv-backend.pid ]; then kill $(cat /tmp/ctv-backend.pid) || true; fi
          if [ -f /tmp/flight-api.pid ]; then kill $(cat /tmp/flight-api.pid) || true; fi

  test-frontend:
    name: Test and Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  publish:
    name: Publish Images
    needs: [test-backend, test-flight-api, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}/ctv-backend:latest

      - uses: docker/build-push-action@v6
        with:
          context: ./flight-api
          push: true
          tags: ghcr.io/${{ github.repository }}/ctv-flight-api:latest

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/ctv-frontend:latest
