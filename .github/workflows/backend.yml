name: Backend CI/CD

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/backend.yml'
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ctv
          POSTGRES_USER: ctv
          POSTGRES_PASSWORD: ctv
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ctv -d ctv"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: ctv
      DB_USER: ctv
      DB_PASSWORD: ctv
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install root test dependencies
        working-directory: .
        run: npm ci

      - name: Install dependencies
        run: npm ci

  

      - name: Run unit tests
        run: npm test

      - name: Run database migrations
        run: npm run db:migrate

      - name: Run Cucumber tests
        run: npm run test:cucumber

      - name: Start backend for E2E tests
        run: |
          npm start > /tmp/ctv-backend.log 2>&1 &
          echo $! > /tmp/ctv-backend.pid
          for attempt in {1..20}; do
            if curl --fail http://localhost:3000/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ctv-backend.log
          exit 1

      - name: Run E2E tests
        env:
          E2E_BASE_URL: http://localhost:3000
        run: npm run test:e2e

      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/ctv-backend.pid ]; then
            kill $(cat /tmp/ctv-backend.pid) || true
          fi

  publish:
    name: Publish backend image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/ctv-backend
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
