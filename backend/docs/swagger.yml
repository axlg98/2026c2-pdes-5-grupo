openapi: 3.0.3
info:
  title: CTV - API del proyecto
  description: Especificación de los endpoints del backend de CTV y del servicio de vuelos.
  version: 1.0.0
servers:
  - url: http://localhost:3000/api
    description: Backend principal
tags:
  - name: Salud
  - name: Autenticación
  - name: Usuarios
  - name: Hoteles
  - name: Paquetes
  - name: Agencias
  - name: Compras
  - name: Favoritos
  - name: Aerolíneas
    description: Servicio de vuelos (Flight API). Requiere JWT con rol agencia o admin.
  - name: Vuelos
    description: Servicio de vuelos (Flight API). Requiere JWT con rol agencia o admin.
  - name: Ventas de vuelos
    description: Servicio de vuelos (Flight API). Requiere JWT con rol agencia o admin.
paths:
  /health:
    servers:
      - url: http://localhost:3000
        description: Salud del backend principal
      - url: http://localhost:3001
        description: Salud del servicio de vuelos
    get:
      tags: [Salud]
      summary: Comprobar disponibilidad del servicio
      description: Disponible sin autenticación en ambos servicios.
      responses:
        '200':
          description: Servicio disponible.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
        '500':
          description: Error de conexión del backend principal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
        '503':
          description: Error de conexión de Flight API.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error

  /auth/register:
    post:
      tags: [Autenticación]
      summary: Registrar un comprador
      description: El registro público siempre crea un usuario con rol comprador.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, email, password]
              properties:
                nombre:
                  type: string
                  example: Ana Pérez
                email:
                  type: string
                  format: email
                  example: ana@example.com
                password:
                  type: string
                  minLength: 6
                  format: password
                  example: clave123
      responses:
        '201':
          description: Usuario registrado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                  usuario:
                    $ref: '#/components/schemas/UsuarioBasico'
        '400':
          $ref: '#/components/responses/ErrorSolicitud'
        '409':
          description: El email ya está registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Sesión iniciada. El token vence en ocho horas.
          content:
            application/json:
              schema:
                type: object
                required: [token, usuario]
                properties:
                  token:
                    type: string
                    description: JWT para enviar como Bearer token.
                  usuario:
                    $ref: '#/components/schemas/UsuarioBasico'
        '400':
          $ref: '#/components/responses/ErrorSolicitud'
        '401':
          $ref: '#/components/responses/ErrorNoAutenticado'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /auth/me:
    get:
      tags: [Autenticación]
      summary: Consultar mi perfil
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil del usuario autenticado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuario:
                    $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/ErrorNoAutenticado'
        '404':
          $ref: '#/components/responses/ErrorNoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorServidor'
    put:
      tags: [Autenticación]
      summary: Actualizar mi perfil
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerfilInput'
      responses:
        '200':
          description: Perfil actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioModificado'
        '400':
          $ref: '#/components/responses/ErrorSolicitud'
        '401':
          $ref: '#/components/responses/ErrorNoAutenticado'
        '409':
          $ref: '#/components/responses/ErrorConflicto'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /auth/users:
    servers:
      - url: http://localhost:3000/api
    get:
      tags: [Usuarios]
      summary: Listar usuarios (administrador)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuarios registrados.
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuarios:
                    type: array
                    items:
                      $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/ErrorNoAutenticado'
        '403':
          $ref: '#/components/responses/ErrorSinPermiso'
        '500':
          $ref: '#/components/responses/ErrorServidor'
    post:
      tags: [Usuarios]
      summary: Crear usuario (administrador)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, email, password, rol]
              properties:
                nombre:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
                  format: password
                rol:
                  $ref: '#/components/schemas/Rol'
      responses:
        '201':
          description: Usuario creado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                  usuario:
                    $ref: '#/components/schemas/UsuarioBasico'
        '400':
          $ref: '#/components/responses/ErrorSolicitud'
        '401':
          $ref: '#/components/responses/ErrorNoAutenticado'
        '403':
          $ref: '#/components/responses/ErrorSinPermiso'
        '409':
          $ref: '#/components/responses/ErrorConflicto'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /auth/users/{usuario_id}:
    parameters:
      - $ref: '#/components/parameters/UsuarioId'
    get:
      tags: [Usuarios]
      summary: Consultar usuario (administrador)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuario consultado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuario:
                    $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/ErrorSolicitud'
        '401':
          $ref: '#/components/responses/ErrorNoAutenticado'
        '403':
          $ref: '#/components/responses/ErrorSinPermiso'
        '404':
          $ref: '#/components/responses/ErrorNoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorServidor'
    put:
      tags: [Usuarios]
      summary: Modificar usuario (administrador)
      description: No permite cambiar el propio rol, desactivarse ni modificar otro administrador.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/PerfilInput'
                - type: object
                  properties:
                    rol:
                      $ref: '#/components/schemas/Rol'
                    activo:
                      type: boolean
      responses:
        '200':
          description: Usuario modificado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioModificado'
        '400':
          $ref: '#/components/responses/ErrorSolicitud'
        '401':
          $ref: '#/components/responses/ErrorNoAutenticado'
        '403':
          $ref: '#/components/responses/ErrorSinPermiso'
        '404':
          $ref: '#/components/responses/ErrorNoEncontrado'
        '409':
          $ref: '#/components/responses/ErrorConflicto'
        '500':
          $ref: '#/components/responses/ErrorServidor'
    delete:
      tags: [Usuarios]
      summary: Desactivar usuario (administrador)
      description: Desactiva la cuenta; no elimina físicamente el registro.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuario desactivado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioModificado'
        '400':
          $ref: '#/components/responses/ErrorSolicitud'
        '401':
          $ref: '#/components/responses/ErrorNoAutenticado'
        '403':
          $ref: '#/components/responses/ErrorSinPermiso'
        '404':
          $ref: '#/components/responses/ErrorNoEncontrado'
        '409':
          $ref: '#/components/responses/ErrorConflicto'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /hoteles:
    get:
      tags: [Hoteles]
      summary: Listar hoteles
      parameters:
        - name: destino
          in: query
          required: false
          schema:
            type: string
          description: Filtra hoteles por destino exacto.
      responses:
        '200':
          description: Lista de hoteles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Hotel'
        '500':
          $ref: '#/components/responses/ErrorServidor'
    post:
      tags: [Hoteles]
      summary: Crear hotel (administrador)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, destino]
              properties:
                nombre:
                  type: string
                  example: Hotel del Lago
                destino:
                  type: string
                  example: Bariloche
                foto:
                  type: string
                  nullable: true
                  example: https://example.com/hotel.jpg
      responses:
        '201':
          description: Hotel creado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                  hotel:
                    $ref: '#/components/schemas/Hotel'
        '400':
          $ref: '#/components/responses/ErrorSolicitud'
        '401':
          $ref: '#/components/responses/ErrorNoAutenticado'
        '403':
          $ref: '#/components/responses/ErrorSinPermiso'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /paquetes:
    get:
      tags: [Paquetes]
      summary: Buscar paquetes disponibles
      parameters:
        - name: palabraClave
          in: query
          schema:
            type: string
        - name: destino
          in: query
          schema:
            type: string
        - name: origen
          in: query
          schema:
            type: string
        - name: precioMin
          in: query
          schema:
            type: number
            minimum: 0
        - name: precioMax
          in: query
          schema:
            type: number
            minimum: 0
      responses:
        '200':
          description: Paquetes ordenados por precio ascendente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  paquetes:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaquetePublico'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /compras:
    get:
      tags: [Compras]
      summary: Listar compras propias o todas (administrador)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Compras visibles para el usuario.
          content:
            application/json:
              schema:
                type: object
                properties:
                  compras:
                    type: array
                    items:
                      $ref: '#/components/schemas/Compra'
        '401':
          $ref: '#/components/responses/ErrorNoAutenticado'
        '403':
          $ref: '#/components/responses/ErrorSinPermiso'
        '500':
          $ref: '#/components/responses/ErrorServidor'
    post:
      tags: [Compras]
      summary: Comprar un paquete (comprador)
      description: Registra la compra y vende los dos vuelos asociados al paquete.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paquete_id, nombre_pasajero]
              properties:
                paquete_id:
                  type: integer
                  minimum: 1
                  example: 12
                nombre_pasajero:
                  type: string
                  example: Ana Pérez
      responses:
        '201':
          description: Compra registrada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                  compra:
                    $ref: '#/components/schemas/Compra'
        '400':
          $ref: '#/components/responses/ErrorSolicitud'
        '401':
          $ref: '#/components/responses/ErrorNoAutenticado'
        '403':
          $ref: '#/components/responses/ErrorSinPermiso'
        '404':
          $ref: '#/components/responses/ErrorNoEncontrado'
        '409':
          $ref: '#/components/responses/ErrorConflicto'
        '500':
          $ref: '#/components/responses/ErrorServidor'
        '502':
          $ref: '#/components/responses/ErrorPasarela'

  /compras/{compra_id}:
    parameters:
      - name: compra_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Compras]
      summary: Consultar una compra propia (o cualquier compra como administrador)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Compra consultada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  compra:
                    $ref: '#/components/schemas/Compra'
        '400':
          $ref: '#/components/responses/ErrorSolicitud'
        '401':
          $ref: '#/components/responses/ErrorNoAutenticado'
        '403':
          $ref: '#/components/responses/ErrorSinPermiso'
        '404':
          $ref: '#/components/responses/ErrorNoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorServidor'
    put:
      tags: [Compras]
      summary: Cambiar nombre del pasajero
      description: Solo se puede modificar una compra no cancelada.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre_pasajero]
              properties:
                nombre_pasajero:
                  type: string
                  example: Ana Pérez
      responses:
        '200':
          description: Compra modificada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompraModificada'
        '400':
          $ref: '#/components/responses/ErrorSolicitud'
        '401':
          $ref: '#/components/responses/ErrorNoAutenticado'
        '403':
          $ref: '#/components/responses/ErrorSinPermiso'
        '404':
          $ref: '#/components/responses/ErrorNoEncontrado'
        '409':
          $ref: '#/components/responses/ErrorConflicto'
        '500':
          $ref: '#/components/responses/ErrorServidor'
    delete:
      tags: [Compras]
      summary: Cancelar una compra y reembolsar los vuelos
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Compra cancelada y vuelos reembolsados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompraModificada'
        '400':
          $ref: '#/components/responses/ErrorSolicitud'
        '401':
          $ref: '#/components/responses/ErrorNoAutenticado'
        '403':
          $ref: '#/components/responses/ErrorSinPermiso'
        '404':
          $ref: '#/components/responses/ErrorNoEncontrado'
        '409':
          $ref: '#/components/responses/ErrorConflicto'
        '500':
          $ref: '#/components/responses/ErrorServidor'
        '502':
          $ref: '#/components/responses/ErrorPasarela'

  /agencia/usuarios:
    get:
      tags: [Agencias]
      summary: Listar usuarios con rol agencia (administrador)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuarios disponibles para asociar a una agencia.
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuarios:
                    type: array
                    items:
                      $ref: '#/components/schemas/UsuarioBasico'
        '401':
          $ref: '#/components/responses/ErrorNoAutenticado'
        '403':
          $ref: '#/components/responses/ErrorSinPermiso'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /agencia/lista:
    get:
      tags: [Agencias]
      summary: Listar agencias (administrador)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Agencias registradas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  agencias:
                    type: array
                    items:
                      $ref: '#/components/schemas/Agencia'
        '401':
          $ref: '#/components/responses/ErrorNoAutenticado'
        '403':
          $ref: '#/components/responses/ErrorSinPermiso'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /agencia/mia:
    get:
      tags: [Agencias]
      summary: Consultar mi agencia (agencia)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Agencia asociada al usuario.
          content:
            application/json:
              schema:
                type: object
                properties:
                  agencia:
                    $ref: '#/components/schemas/Agencia'
        '401':
          $ref: '#/components/responses/ErrorNoAutenticado'
        '403':
          $ref: '#/components/responses/ErrorSinPermiso'
        '404':
          $ref: '#/components/responses/ErrorNoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorServidor'
    put:
      tags: [Agencias]
      summary: Modificar mi agencia (agencia)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgenciaInput'
      responses:
        '200':
          description: Agencia modificada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgenciaModificada'
        '400':
          $ref: '#/components/responses/ErrorSolicitud'
        '401':
          $ref: '#/components/responses/ErrorNoAutenticado'
        '403':
          $ref: '#/components/responses/ErrorSinPermiso'
        '404':
          $ref: '#/components/responses/ErrorNoEncontrado'
        '409':
          $ref: '#/components/responses/ErrorConflicto'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /agencia/paquetes:
    get:
      tags: [Agencias]
      summary: Listar mis paquetes (agencia)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paquetes de la agencia autenticada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  paquetes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Paquete'
        '401':
          $ref: '#/components/responses/ErrorNoAutenticado'
        '403':
          $ref: '#/components/responses/ErrorSinPermiso'
        '500':
          $ref: '#/components/responses/ErrorServidor'
    post:
      tags: [Agencias]
      summary: Crear paquete (agencia)
      description: Valida hotel, trayectos y disponibilidad de los vuelos.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaqueteInput'
      responses:
        '201':
          description: Paquete creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaqueteModificado'
        '400':
          $ref: '#/components/responses/ErrorSolicitud'
        '401':
          $ref: '#/components/responses/ErrorNoAutenticado'
        '403':
          $ref: '#/components/responses/ErrorSinPermiso'
        '404':
          $ref: '#/components/responses/ErrorNoEncontrado'
        '409':
          $ref: '#/components/responses/ErrorConflicto'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /agencia/paquetes/{paquete_id}:
    parameters:
      - name: paquete_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    put:
      tags: [Agencias]
      summary: Modificar un paquete propio (agencia)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaqueteInput'
      responses:
        '200':
          description: Paquete actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaqueteModificado'
        '400':
          $ref: '#/components/responses/ErrorSolicitud'
        '401':
          $ref: '#/components/responses/ErrorNoAutenticado'
        '403':
          $ref: '#/components/responses/ErrorSinPermiso'
        '404':
          $ref: '#/components/responses/ErrorNoEncontrado'
        '409':
          $ref: '#/components/responses/ErrorConflicto'
        '500':
          $ref: '#/components/responses/ErrorServidor'
    delete:
      tags: [Agencias]
      summary: Eliminar un paquete propio (agencia)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paquete eliminado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaqueteEliminado'
        '401':
          $ref: '#/components/responses/ErrorNoAutenticado'
        '403':
          $ref: '#/components/responses/ErrorSinPermiso'
        '404':
          $ref: '#/components/responses/ErrorNoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /agencia/compras:
    get:
      tags: [Agencias]
      summary: Consultar ventas de mi agencia (agencia)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Compras asociadas a la agencia autenticada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  compras:
                    type: array
                    items:
                      $ref: '#/components/schemas/Compra'
        '401':
          $ref: '#/components/responses/ErrorNoAutenticado'
        '403':
          $ref: '#/components/responses/ErrorSinPermiso'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /agencia:
    post:
      tags: [Agencias]
      summary: Crear agencia (administrador)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/AgenciaInput'
                - type: object
                  required: [user_id]
                  properties:
                    user_id:
                      type: integer
                      minimum: 1
      responses:
        '201':
          description: Agencia creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgenciaModificada'
        '400':
