components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UsuarioId:
      name: usuario_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: No autenticado.
    Rol:
      type: string
      enum: [comprador, agencia, admin]
    UsuarioBasico:
      type: object
      properties:
        id:
          type: integer
          example: 5
        nombre:
          type: string
          example: Ana Pérez
        email:
          type: string
          format: email
        rol:
          $ref: '#/components/schemas/Rol'
    Usuario:
      allOf:
        - $ref: '#/components/schemas/UsuarioBasico'
        - type: object
          properties:
            activo:
              type: boolean
            actualizado_en:
              type: string
              format: date-time
    PerfilInput:
      type: object
      required: [nombre, email]
      properties:
        nombre:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
          format: password
    UsuarioModificado:
      type: object
      properties:
        mensaje:
          type: string
        usuario:
          $ref: '#/components/schemas/Usuario'
    Hotel:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        destino:
          type: string
        foto:
          type: string
          nullable: true
    Paquete:
      type: object
      properties:
        paquete_id:
          type: integer
        agencia_id:
          type: integer
        hotel_id:
          type: integer
        vuelo_ida_id:
          type: integer
        vuelo_vuelta_id:
          type: integer
        fecha_ida:
          type: string
          format: date
        fecha_vuelta:
          type: string
          format: date
        precio:
          type: string
        descripcion:
          type: string
        nombre:
          type: string
          nullable: true
        origen:
          type: string
        destino:
          type: string
    PaquetePublico:
      allOf:
        - $ref: '#/components/schemas/Paquete'
        - type: object
          properties:
            hotel:
              type: string
            hotelFoto:
              type: string
              nullable: true
            agencia:
              type: string
    PaqueteFavorito:
      type: object
      properties:
        paquete_id:
          type: integer
        nombre:
          type: string
          nullable: true
        origen:
          type: string
        destino:
          type: string
        precio:
          type: string
    PaqueteInput:
      type: object
      required:
        - nombre
        - destino
        - origen
        - descripcion
        - precio
        - hotel_id
        - vuelo_ida_id
        - vuelo_vuelta_id
        - fecha_ida
        - fecha_vuelta
      properties:
        nombre:
          type: string
        destino:
          type: string
        origen:
          type: string
        descripcion:
          type: string
        precio:
          type: number
          exclusiveMinimum: true
          minimum: 0
        hotel_id:
          type: integer
          minimum: 1
        vuelo_ida_id:
          type: integer
          minimum: 1
        vuelo_vuelta_id:
          type: integer
          minimum: 1
        fecha_ida:
          type: string
          format: date
        fecha_vuelta:
          type: string
          format: date
    PaqueteModificado:
      type: object
      properties:
        mensaje:
          type: string
        paquete:
          $ref: '#/components/schemas/Paquete'
    PaqueteEliminado:
      type: object
      properties:
        mensaje:
          type: string
        paquete:
          type: object
          properties:
            paquete_id:
              type: integer
    Agencia:
      type: object
      properties:
        agencia_id:
          type: integer
        user_id:
          type: integer
        nombre:
          type: string
        email:
          type: string
          format: email
        telefono:
          type: string
          nullable: true
    AgenciaInput:
      type: object
      required: [nombre, email]
      properties:
        nombre:
          type: string
        email:
          type: string
          format: email
        telefono:
          type: string
          nullable: true
    AgenciaModificada:
      type: object
      properties:
        mensaje:
          type: string
        agencia:
          $ref: '#/components/schemas/Agencia'
    Compra:
      type: object
      properties:
        compra_id:
          type: integer
        user_id:
          type: integer
        paquete_id:
          type: integer
        agencia_id:
          type: integer
        hotel_id:
          type: integer
        vuelo_ida_id:
          type: integer
        vuelo_vuelta_id:
          type: integer
        venta_vuelo_ida_id:
          type: integer
        venta_vuelo_vuelta_id:
          type: integer
        nombre_pasajero:
          type: string
        fecha_compra:
          type: string
          format: date-time
        fecha_ida:
          type: string
          format: date
        fecha_vuelta:
          type: string
          format: date
        precio_pagado:
          type: string
          example: '250000.00'
        estado:
          type: string
          enum: [activa, cancelada]
        actualizado_en:
          type: string
          format: date-time
        cancelada_en:
          type: string
          format: date-time
          nullable: true
    CompraModificada:
      type: object
      properties:
        mensaje:
          type: string
        compra:
          $ref: '#/components/schemas/Compra'
    Favorito:
      type: object
      properties:
        favorito_id:
          type: integer
        paquete_id:
          type: integer
        puntaje:
          type: integer
          minimum: 0
          maximum: 10
          nullable: true
        comentario:
          type: string
          maxLength: 255
          nullable: true
    FavoritoPersistido:
      allOf:
        - $ref: '#/components/schemas/Favorito'
        - type: object
          properties:
            user_id:
              type: integer
    FavoritoConPaquete:
      allOf:
        - $ref: '#/components/schemas/Favorito'
        - type: object
          properties:
            nombre:
              type: string
              nullable: true
            origen:
              type: string
            destino:
              type: string
            precio:
              type: string
    FavoritoModificado:
      type: object
      properties:
        mensaje:
          type: string
        favorito:
          $ref: '#/components/schemas/FavoritoPersistido'
    Aerolinea:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        pais:
          type: string
    VueloInput:
      type: object
      required: [aerolineaId, codigo, fecha, hora, origen, destino, capacidad]
      properties:
        aerolineaId:
          type: integer
          minimum: 1
        codigo:
          type: string
        fecha:
          type: string
          format: date
        hora:
          type: string
          example: '09:30:00'
        origen:
          type: string
        destino:
          type: string
        capacidad:
          type: integer
          minimum: 1
    Vuelo:
      type: object
      properties:
        id:
          type: integer
        aerolineaId:
          type: integer
        codigo:
          type: string
        fecha:
          type: string
          format: date
        hora:
          type: string
        origen:
          type: string
        destino:
          type: string
        capacidad:
          type: integer
        disponibilidad:
          type: integer
    VueloListado:
      allOf:
        - $ref: '#/components/schemas/Vuelo'
        - type: object
          properties:
            aerolinea:
              type: string
            aerolineaId:
              type: integer
    VentaVuelo:
      type: object
      properties:
        id:
          type: integer
        vueloId:
          type: integer
        nombrePasajero:
          type: string
        vendidoEn:
          type: string
          format: date-time
        reembolsado:
          type: boolean
        reembolsadoEn:
          type: string
          format: date-time
          nullable: true
    VentaListado:
      type: object
      properties:
        id:
          type: integer
        vueloId:
          type: integer
        nombrePasajero:
          type: string
        vendidoEn:
          type: string
          format: date-time
        codigo:
          type: string
    ResultadoInicializacion:
      type: object
      properties:
        mensaje:
          type: string
        aerolineasCreadas:
          type: integer
        vuelosCreados:
          type: integer
  responses:
    ErrorSolicitud:
      description: Datos faltantes o inválidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ErrorNoAutenticado:
      description: Token ausente, inválido o vencido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: No autenticado.
    ErrorSinPermiso:
      description: El usuario no tiene el rol o permiso requerido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: No tenés permisos para esta acción.
    ErrorNoEncontrado:
      description: Recurso no encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ErrorConflicto:
      description: Conflicto con el estado o los datos existentes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ErrorPasarela:
      description: Falló una operación con el servicio de vuelos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ErrorServidor:
      description: Error interno del servidor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
